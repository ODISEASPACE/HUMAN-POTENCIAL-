<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odisea | Feedback Alpha</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { bgMain: '#F8FAFC', primaryText: '#0F172A', accentAction: '#2563EB' }
                }
            }
        }
    </script>
</head>

<body class="bg-bgMain text-primaryText font-sans min-h-screen flex items-center justify-center p-4">

    <main id="feedbackContainer" class="max-w-3xl w-full bg-white p-8 md:p-10 rounded-2xl shadow-xl my-8">
        
        <div class="mb-8 border-b pb-6">
            <h1 class="text-3xl font-extrabold mb-2 tracking-tight text-primaryText">Fase Alpha: Tu Opinión</h1>
            <p class="text-slate-600 text-base">
                Como beta tester de septiembre, tu experiencia define la versión final de Odisea. Ayúdanos a pulir el sistema respondiendo estas breves preguntas.
            </p>
        </div>

        <div class="flex flex-col gap-8 mb-10">
            <div>
                <label class="block text-base font-bold text-primaryText mb-2">
                    1. ¿En qué momento exacto del registro o durante el test sentiste la tentación de cerrar la aplicación o respondiste sin pensar?
                </label>
                <textarea id="frictionInput" rows="3" class="w-full p-4 border-2 border-slate-200 rounded-xl focus:border-accentAction focus:ring-0 outline-none transition-colors text-slate-700" placeholder="Sé brutalmente honesto..."></textarea>
            </div>

            <div>
                <label class="block text-base font-bold text-primaryText mb-2">
                    2. ¿Hubo alguna pregunta del test que te pareciera confusa, ambigua o imposible de responder con las opciones dadas? Indica cuál.
                </label>
                <textarea id="clarityInput" rows="3" class="w-full p-4 border-2 border-slate-200 rounded-xl focus:border-accentAction focus:ring-0 outline-none transition-colors text-slate-700" placeholder="Ej: La pregunta sobre mis rutinas me confundió..."></textarea>
            </div>

            <div>
                <label class="block text-base font-bold text-primaryText mb-2">
                    3. Ahora que conoces tu perfil y has seleccionado tus metas, ¿qué esperas que haga esta plataforma por ti todos los días al registrar tus habitos?
                </label>
                <textarea id="expectationInput" rows="3" class="w-full p-4 border-2 border-slate-200 rounded-xl focus:border-accentAction focus:ring-0 outline-none transition-colors text-slate-700" placeholder="Espero que me regañe si fallo, que me muestre gráficas de..."></textarea>
            </div>
        </div>

        <button id="btnSubmitFinal" class="w-full bg-accentAction text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 hover:scale-[1.02] transition-all text-lg uppercase tracking-wide">
            Finalizar Odisea
        </button>

    </main>

    <main id="registerContainer" class="hidden max-w-xl w-full bg-white p-10 text-center rounded-2xl shadow-xl">
        <h1 class="text-3xl font-extrabold mb-4 text-primaryText">¡No pierdas tu progreso!</h1>
        <p class="text-slate-600 mb-8">Crea tu cuenta ahora para guardar tu Arquetipo y Objetivos en la base de datos central.</p>
        
        <div class="flex flex-col gap-4 text-left">
            <input type="text" id="regName" placeholder="Tu Nombre o Alias" class="w-full p-4 border-2 border-slate-200 rounded-xl outline-none">
            <input type="email" id="regEmail" placeholder="Tu correo electrónico" class="w-full p-4 border-2 border-slate-200 rounded-xl outline-none">
            <input type="password" id="regPassword" placeholder="Contraseña (Mínimo 8)" class="w-full p-4 border-2 border-slate-200 rounded-xl outline-none">
            
            <button id="btnRegisterAndSave" class="w-full bg-accentAction text-white font-bold py-4 rounded-xl shadow-lg mt-2">
                Crear Cuenta y Guardar Todo
            </button>
        </div>
    </main>

    <script>
        // Variable Global protegida
        window.API_URL = "http://" + (window.location.hostname || "127.0.0.1") + ":8000/api";

        document.getElementById('btnSubmitFinal').onclick = async () => {
            const userId = localStorage.getItem('user_id');
            
            const feedbackPayload = {
                identity_validation: "Dato no capturado en esta pantalla", 
                friction_detection: document.getElementById('frictionInput').value.trim(),
                cognitive_clarity: document.getElementById('clarityInput').value.trim(),
                tracktime_expectation: document.getElementById('expectationInput').value.trim()
            };

            if (!userId) {
                localStorage.setItem('pending_feedback', JSON.stringify(feedbackPayload));
                document.getElementById('feedbackContainer').classList.add('hidden');
                document.getElementById('registerContainer').classList.remove('hidden');
                return; 
            }

            try {
                // Endpoint correcto para el feedback
                const response = await fetch(window.API_URL + '/alpha-feedback/' + userId, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(feedbackPayload)
                });

                if (response.ok) {
                    localStorage.removeItem('odisea_voc_responses');
                    window.location.href = 'success.html';
                } else {
                    const errorData = await response.json();
                    alert("Error en el servidor: " + JSON.stringify(errorData));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Fallo de conexión con la base de datos.");
            }
        };

        // LÓGICA DEL REGISTRO FINAL (AMETRALLADORA DE DATOS)
        document.getElementById('btnRegisterAndSave').onclick = async () => {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            if (!name || !email || !password) {
                alert("Por favor, llena todos los campos.");
                return;
            }

            try {
                // 1. REGISTRAR EL USUARIO
                const res = await fetch(window.API_URL + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email, password: password })
                });
                
                if (!res.ok) {
                    const errorData = await res.json();
                    throw new Error(errorData.detail || "Error en el registro");
                }
                
                const userData = await res.json();
                const newUserId = userData.id;

                // 2. RECUPERAR DATOS FANTASMAS DE LA MEMORIA
                const pendingTest = localStorage.getItem('pending_test');
                const pendingGoals = localStorage.getItem('pending_goals');
                const pendingFeedback = localStorage.getItem('pending_feedback');

                // 3. DISPARAR TODO A POSTGRESQL USANDO EL NUEVO ID Y RUTAS CORRECTAS
                if (pendingTest) {
                    await fetch(window.API_URL + '/test-voc/' + newUserId, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: pendingTest
                    });
                }
                
                if (pendingGoals) {
                    await fetch(window.API_URL + '/tracktime-goals/' + newUserId, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: pendingGoals
                    });
                }

                if (pendingFeedback) {
                    await fetch(window.API_URL + '/alpha-feedback/' + newUserId, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: pendingFeedback
                    });
                }

                // 4. LIMPIEZA FINAL Y REDIRECCIÓN
                localStorage.setItem('user_id', newUserId);
                localStorage.setItem('is_logged_in', 'true');
                
                localStorage.removeItem('pending_test');
                localStorage.removeItem('pending_goals');
                localStorage.removeItem('pending_feedback');
                localStorage.removeItem('odisea_voc_responses');
                
                window.location.href = 'success.html';

            } catch (error) {
                console.error(error);
                alert("Ocurrió un error: " + error.message);
            }
        };
    </script>
</body>
</html>

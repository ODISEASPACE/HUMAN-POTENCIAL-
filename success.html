<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odisea | Operación Exitosa</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { bgMain: '#F8FAFC', primaryText: '#0F172A', accentAction: '#2563EB' }
                }
            }
        }
    </script>
</head>

<body class="bg-bgMain text-primaryText font-sans min-h-screen flex items-center justify-center p-4">

    <main class="max-w-md w-full bg-white p-10 text-center rounded-2xl shadow-xl">
        
        <!-- Ícono de éxito -->
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <h1 class="text-3xl font-extrabold mb-4 tracking-tight text-primaryText">Misión Cumplida</h1>
        <p class="text-slate-600 mb-8 text-base">
            Tus coordenadas han sido registradas en la base de datos central de Odisea. Has completado la Fase Alpha con éxito.
        </p>

        <button id="btnLogout" class="w-full bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-slate-700 hover:scale-[1.02] transition-all text-lg uppercase tracking-wide">
            Cerrar Sesión
        </button>
        
    </main>

    <script>
        document.getElementById('btnLogout').onclick = () => {
            // Destruimos la sesión en la memoria del navegador
            localStorage.clear();
            
            // Redirigimos a la pantalla inicial o login (Ajusta 'login.html' si tu inicio se llama distinto)
            window.location.href = 'login.html';
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odisea | Iniciar Sesión</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { bgMain: '#F8FAFC', primaryText: '#0F172A', accentAction: '#2563EB' }
                }
            }
        }
    </script>
</head>

<body class="bg-bgMain text-primaryText font-sans min-h-screen flex items-center justify-center p-4">

    <main class="max-w-md w-full bg-white p-8 md:p-10 rounded-2xl shadow-xl text-center">
        
        <h1 class="text-3xl font-extrabold mb-2 tracking-tight text-primaryText">Bienvenido a Odisea</h1>
        <p class="text-slate-600 mb-8 text-sm">
            Ingresa tus credenciales para continuar tu trayectoria.
        </p>

        <form id="loginForm" class="flex flex-col gap-5 text-left">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Correo Electrónico</label>
                <input type="email" id="emailInput" required placeholder="tu@correo.com" 
                    class="w-full p-4 border-2 border-slate-200 rounded-xl focus:border-accentAction focus:ring-0 outline-none transition-colors text-slate-700">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Contraseña</label>
                <input type="password" id="passwordInput" required placeholder="Tu contraseña" 
                    class="w-full p-4 border-2 border-slate-200 rounded-xl focus:border-accentAction focus:ring-0 outline-none transition-colors text-slate-700">
            </div>

            <button type="submit" id="btnLogin" class="w-full bg-accentAction text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 hover:scale-[1.02] transition-all text-lg mt-2">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 text-sm text-slate-500">
            ¿Aún no tienes cuenta? <a href="register.html" class="text-accentAction font-bold hover:underline">Regístrate aquí</a>
        </div>
        
    </main>

    <script>
        // Variable Global protegida
        window.API_URL = "http://" + (window.location.hostname || "127.0.0.1") + ":8000/api";

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            const payload = {
                email: email,
                password: password
            };

            try {
                // Endpoint correcto: /login (Tenías /register)
                const response = await fetch(window.API_URL + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('is_logged_in', 'true');
                    
                    alert(`¡Bienvenido de vuelta, ${data.name}!`);
                    
                    if (data.has_completed_test === true) {
                        window.location.href = 'success.html'; 
                    } else {
                        window.location.href = 'legal.html'; 
                    }

                } else {
                    alert("Error: " + data.detail);
                }

            } catch (error) {
                console.error("Error de conexión:", error);
                alert("No se pudo conectar con el servidor.");
            }
        });
    </script>
</body>
</html>
